[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pieforhead"
dynamic = ["version"]
authors = [
    {name = "wjs018", email = "wjs018@gmail.com"},
]
description = "A python library for interacting with the PieFed API"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["piefed", "fediverse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
]
license = "Unlicense"
license-files = ["LICENSE"]
dependencies =[
  "httpx",
  "semver",
]

[tool.hatch.version]
path = "src/pieforhead/utils.py"

[tool.hatch.build]
exclude = ["/test_*"]

[tool.hatch.build.targets.wheel]
exclude = ["tests/**", "docs/**", "mkdocs.yml"]

[project.urls]
Homepage = "https://github.com/wjs018/pieforhead"
Issues = "https://github.com/wjs018/pieforhead/issues"

[tool.ruff]
line-length = 119

[tool.pytest.ini_options]
pythonpath = ["src"]
